    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker cleanup for legacy workers & registration for APLEX
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // Immediately unregister any stale dev-sw.js registrations
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              var r = regs[i];
              var script = (r.active && r.active.scriptURL) ||
                           (r.installing && r.installing.scriptURL) ||
                           (r.waiting && r.waiting.scriptURL) || '';
              if (script.indexOf('dev-sw') !== -1) {
                r.unregister();
              }
            }
          }).catch(function() {});

          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update().catch(function() {});
            setInterval(function() {
              reg.update().catch(function() {});
            }, 30000);
          }).catch(function(err) {
            console.log('SW init:', err);
          });
        });

        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
